<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dibujos de Mapas IGN</title>
  <!-- Google Fonts - Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <div id="app">
    <!-- NAVBAR SUPERIOR FLOTANTE (IDENTIDAD) -->
    <nav class="nbi-window-floating nbi-navbar" id="navbar">
      <div class="nbi-navbar-brand">
        <img src="./public/logo-ign-blanco.svg" alt="nstituto Geográfico Nacional" class="nbi-navbar-logo" />
        <span class="nbi-navbar-title">Mapas escolares</span>
      </div>
      <span class="nbi-navbar-subtitle">IGN Argentina</span>
    </nav>

    <!-- BOTÓN DE ENLACE EXTERNO (ESQUINA SUPERIOR DERECHA) -->
    <a href="https://www.ign.gob.ar/AreaServicios/Descargas/MapasEscolares" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="nbi-btn nbi-external-link-btn" 
       id="ign-link-btn" 
       title="Ir a Mapas Escolares IGN (abre en nueva pestaña)" 
       aria-label="Ir a Descargas de Mapas Escolares del Instituto Geográfico Nacional (abre en nueva pestaña)">
      <i data-lucide="external-link"></i>
      <span class="btn-text">Descargar Mapas Oficiales</span>
    </a>

    <!-- BOTÓN FLOTANTE PARA EXPANDIR EL CATÁLOGO -->
    <button class="nbi-btn nbi-toggle-sidebar-btn hidden" id="toggle-sidebar-btn" title="Mostrar Mapas">
      <i data-lucide="map"></i>
    </button>

    <!-- CATÁLOGO DE MAPAS DE PROVINCIAS (PANEL LATERAL) -->
    <aside class="nbi-window-floating nbi-sidebar-catalog" id="sidebar-catalog">
      <div class="nbi-sidebar-header">
        <span class="nbi-sidebar-title">Elegí tu Mapa</span>
        <button class="nbi-btn" id="close-sidebar-btn" style="min-width: 40px; min-height: 40px; padding: 6px;"
          title="Cerrar Menú">
          <i data-lucide="chevron-left"></i>
        </button>
      </div>
      <div class="nbi-sidebar-scroll" id="map-cards-container">
        <!-- Las tarjetas se generarán dinámicamente desde JS -->
      </div>
    </aside>

    <!-- LIENZO PRINCIPAL (CONTENEDOR DEL CANVAS) -->
    <div id="editor-container" class="canvas-root"></div>

    <!-- BARRA DE HERRAMIENTAS FLOTANTE (SIN ANIDACIÓN nbi-window-floating) -->
    <div class="nbi-toolbar-drawing" id="toolbar-drawing">
      <button class="nbi-btn is-active" id="tool-select" title="Puntero para seleccionar y mover">
        <i data-lucide="mouse-pointer"></i>
      </button>
      <button class="nbi-btn" id="tool-brush" title="Lápiz para dibujar libre">
        <i data-lucide="pencil"></i>
      </button>
      <div class="nbi-toolbar-separator"></div>
      <button class="nbi-btn" id="tool-rect" title="Agregar Rectángulo">
        <i data-lucide="square"></i>
      </button>
      <button class="nbi-btn" id="tool-circle" title="Agregar Círculo">
        <i data-lucide="circle"></i>
      </button>
      <button class="nbi-btn" id="tool-arrow" title="Agregar Flecha">
        <i data-lucide="move-right"></i>
      </button>
      <button class="nbi-btn" id="tool-text" title="Agregar Texto">
        <i data-lucide="type"></i>
      </button>
      <button class="nbi-btn" id="tool-pin" title="Agregar Marcador" aria-label="Agregar marcador o pin al mapa">
        <i data-lucide="map-pin"></i>
      </button>
      <div class="nbi-toolbar-separator"></div>
      <button class="nbi-btn nbi-btn-danger" id="tool-delete" title="Borrar elemento seleccionado">
        <i data-lucide="trash-2"></i>
      </button>
      <button class="nbi-btn nbi-btn-danger" id="tool-clear" title="Borrar todo el dibujo">
        <i data-lucide="eraser"></i>
      </button>
    </div>

    <!-- PANEL DE PROPIEDADES (ESTILOS Y COLORES) -->
    <div class="nbi-window-floating nbi-properties-panel" id="properties-panel">
      <span class="nbi-properties-title">Pintura y Trazo</span>

      <!-- SELECCIÓN DE COLOR -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-weight: 600; font-size: 0.9rem;">Elegí el Color:</span>
        <div class="nbi-color-selector" id="color-chips-container">
          <div class="nbi-color-chip is-active" style="background-color: #faeb8b;" data-color="#faeb8b"
            title="Amarillo Pastel"></div>
          <div class="nbi-color-chip" style="background-color: #82d3f8;" data-color="#82d3f8" title="Azul Pastel"></div>
          <div class="nbi-color-chip" style="background-color: #7abe7d;" data-color="#7abe7d" title="Verde Pastel"></div>
          <div class="nbi-color-chip" style="background-color: #e5828c;" data-color="#e5828c" title="Rosa Pastel"></div>
          <div class="nbi-color-chip" style="background-color: #cc94d6;" data-color="#cc94d6" title="Violeta Pastel"></div>
          <div class="nbi-color-chip" style="background-color: #FFA07A;" data-color="#FFA07A" title="Salmón Claro"></div>
          <div class="nbi-color-chip" style="background-color: #FFD700;" data-color="#FFD700" title="Oro Amarillo"></div>
          <div class="nbi-color-chip" style="background-color: #98FB98;" data-color="#98FB98" title="Verde Pálido"></div>
          <div class="nbi-color-chip" style="background-color: #AFEEEE;" data-color="#AFEEEE" title="Turquesa Pálido"></div>
          <div class="nbi-color-chip" style="background-color: #FFB6C1;" data-color="#FFB6C1" title="Rosa Claro"></div>
          <div class="nbi-color-chip" style="background-color: #B0C4DE;" data-color="#B0C4DE" title="Azul Acero"></div>
          <div class="nbi-color-chip" style="background-color: #E6E6FA;" data-color="#E6E6FA" title="Lavanda"></div>
          <div class="nbi-color-chip" style="background-color: #FFA500;" data-color="#FFA500" title="Naranja Neo-Brutalista"></div>
          <div class="nbi-color-chip" style="background-color: #FFFFFF;" data-color="#FFFFFF" title="Blanco Nítido"></div>
          <div class="nbi-color-chip" style="background-color: #000000;" data-color="#000000" title="Negro Contraste"></div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
          <button class="nbi-btn" id="custom-color-btn" style="min-height: 36px; min-width: 120px; font-size: 0.8rem; font-weight: bold; padding: 6px 12px; border-radius: 8px;" title="Seleccionar color personalizado" aria-label="Seleccionar color personalizado">
            <i data-lucide="palette" style="width: 16px; height: 16px; margin-right: 6px;"></i>
            Más colores
          </button>
          <input type="color" id="custom-color-picker" style="display: none;" />
        </div>
      </div>

      <!-- CONTROL DE GROSOR -->
      <div class="nbi-stroke-control">
        <div class="nbi-stroke-header">
          <span>Grosor del Lápiz:</span>
          <span id="stroke-value-display">8px</span>
        </div>
        <div class="nbi-slider-wrapper">
          <input class="nbi-slider" id="stroke-slider" type="range" min="2" max="24" value="8" />
        </div>
      </div>

      <!-- ACCIONES DEL SISTEMA (DESCARGA) -->
      <div
        style="display: flex; gap: 8px; margin-top: auto; border-top: 3px solid var(--nbi-black); padding-top: 16px;">
        <button class="nbi-btn nbi-btn-success" id="action-export" style="flex: 1;"
          title="Descargar mapa con tus dibujos">
          <i data-lucide="download"></i>
          <span style="font-weight: bold; margin-left: 6px;">Guardar</span>
        </button>
      </div>
    </div>

    <!-- PANEL DE STICKERS (OCULTABLE) -->
    <div class="nbi-window-floating nbi-stickers-panel" id="stickers-panel">
      <div class="nbi-stickers-header">
        <span class="nbi-stickers-title">Decoraciones y Stickers</span>
        <button class="nbi-btn" id="toggle-stickers-btn" style="min-width: 36px; min-height: 36px; padding: 4px; border-radius: 8px;" title="Colapsar Panel" aria-label="Colapsar panel de stickers">
          <i data-lucide="chevron-down"></i>
        </button>
      </div>
      <div class="nbi-stickers-content" id="stickers-container">
        <!-- Los stickers se generarán dinámicamente desde JS -->
      </div>
    </div>

    <!-- MODAL DE COLOR PERSONALIZADO (A11Y & NEO-BRUTALISTA) -->
    <div class="nbi-modal-overlay hidden" id="custom-color-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="nbi-window-floating nbi-color-modal-content">
        <div class="nbi-modal-header">
          <span class="nbi-modal-title" id="modal-title">Color Personalizado</span>
          <button class="nbi-btn nbi-modal-close" id="close-color-modal-btn" style="min-width: 36px; min-height: 36px; padding: 4px; border-radius: 8px;" title="Cerrar modal" aria-label="Cerrar modal de color personalizado">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="nbi-modal-body">
          <!-- Cuadro de Vista Previa -->
          <div class="nbi-color-preview-box" id="color-preview-box" style="background-color: #faeb8b;" aria-label="Vista previa del color seleccionado"></div>
          
          <!-- Controles de HSL -->
          <div class="nbi-color-sliders">
            <div class="nbi-slider-control">
              <div class="nbi-slider-label-container">
                <span class="nbi-slider-label">Tono (Color):</span>
                <span id="hue-val" class="nbi-slider-val">49°</span>
              </div>
              <input type="range" id="color-hue" min="0" max="360" value="49" class="nbi-slider" aria-label="Ajustar tono de color" />
            </div>
            
            <div class="nbi-slider-control">
              <div class="nbi-slider-label-container">
                <span class="nbi-slider-label">Saturación (Brillo):</span>
                <span id="sat-val" class="nbi-slider-val">93%</span>
              </div>
              <input type="range" id="color-saturation" min="0" max="100" value="93" class="nbi-slider" aria-label="Ajustar saturación de color" />
            </div>
            
            <div class="nbi-slider-control">
              <div class="nbi-slider-label-container">
                <span class="nbi-slider-label">Luminosidad (Tono):</span>
                <span id="light-val" class="nbi-slider-val">76%</span>
              </div>
              <input type="range" id="color-lightness" min="10" max="90" value="76" class="nbi-slider" aria-label="Ajustar luminosidad de color" />
            </div>
          </div>
        </div>
        <div class="nbi-modal-footer">
          <button class="nbi-btn nbi-btn-success" id="confirm-custom-color" style="flex: 1; font-weight: bold; border-radius: 8px;" title="Aceptar y guardar color" aria-label="Confirmar y agregar color seleccionado">
            Confirmar Color
          </button>
        </div>
      </div>
    </div>

    <!-- PANTALLA ANIMADA DE CARGA -->
    <div id="loader-overlay" class="nbi-loader-overlay hidden">
      <div class="nbi-loader"></div>
      <div class="nbi-loader-text">¡Preparando tu mapa...!</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
