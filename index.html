<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dibujos de Mapas IGN - NBI Editor</title>
    <!-- Google Fonts - Fredoka -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div id="app">
      <!-- BOTÓN FLOTANTE PARA EXPANDIR EL CATÁLOGO -->
      <button class="nbi-btn nbi-toggle-sidebar-btn hidden" id="toggle-sidebar-btn" title="Mostrar Mapas">
        <i data-lucide="map-map-pin"></i>
      </button>

      <!-- CATÁLOGO DE MAPAS DE PROVINCIAS (PANEL LATERAL) -->
      <aside class="nbi-window-floating nbi-sidebar-catalog" id="sidebar-catalog">
        <div class="nbi-sidebar-header">
          <span class="nbi-sidebar-title">Elegí tu Mapa</span>
          <button class="nbi-btn" id="close-sidebar-btn" style="min-width: 40px; min-height: 40px; padding: 6px;" title="Cerrar Menú">
            <i data-lucide="chevron-left"></i>
          </button>
        </div>
        <div class="nbi-sidebar-scroll" id="map-cards-container">
          <!-- Las tarjetas de provincias se generarán dinámicamente desde JS -->
        </div>
      </aside>

      <!-- LIENZO PRINCIPAL (CONTENEDOR DEL CANVAS) -->
      <div id="editor-container" class="canvas-root"></div>

      <!-- BARRA DE HERRAMIENTAS FLOTANTE JUGUETONA (NBI-DS TOOLBAR) -->
      <div class="nbi-window-floating nbi-toolbar-drawing" id="toolbar-drawing">
        <button class="nbi-btn is-active" id="tool-select" title="Puntero para seleccionar y mover">
          <i data-lucide="mouse-pointer"></i>
        </button>
        <button class="nbi-btn" id="tool-brush" title="Lápiz para dibujar libre">
          <i data-lucide="pencil"></i>
        </button>
        <div style="width: 3px; height: 32px; background: var(--nbi-black); border-radius: 2px;"></div>
        <button class="nbi-btn" id="tool-rect" title="Agregar Rectángulo">
          <i data-lucide="square"></i>
        </button>
        <button class="nbi-btn" id="tool-circle" title="Agregar Círculo">
          <i data-lucide="circle"></i>
        </button>
        <button class="nbi-btn" id="tool-arrow" title="Agregar Flecha">
          <i data-lucide="arrow-right-left" style="transform: rotate(45deg);"></i>
        </button>
        <button class="nbi-btn" id="tool-text" title="Agregar Texto">
          <i data-lucide="type"></i>
        </button>
        <div style="width: 3px; height: 32px; background: var(--nbi-black); border-radius: 2px;"></div>
        <button class="nbi-btn nbi-btn-danger" id="tool-delete" title="Borrar elemento seleccionado">
          <i data-lucide="trash-2"></i>
        </button>
        <button class="nbi-btn nbi-btn-danger" id="tool-clear" title="Borrar todo el dibujo">
          <i data-lucide="eraser"></i>
        </button>
      </div>

      <!-- PANEL DE PROPIEDADES (ESTILOS Y COLORES NBI-DS) -->
      <div class="nbi-window-floating nbi-properties-panel" id="properties-panel">
        <span class="nbi-properties-title">Pintura y Trazo</span>
        
        <!-- SELECCIÓN DE COLOR -->
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span style="font-weight: 600; font-size: 0.9rem;">Elegí el Color:</span>
          <div class="nbi-color-selector" id="color-chips-container">
            <div class="nbi-color-chip is-active" style="background-color: #FFF4B0;" data-color="#FFF4B0" title="Amarillo Pastel"></div>
            <div class="nbi-color-chip" style="background-color: #B3E5FC;" data-color="#B3E5FC" title="Azul Pastel"></div>
            <div class="nbi-color-chip" style="background-color: #C8E6C9;" data-color="#C8E6C9" title="Verde Pastel"></div>
            <div class="nbi-color-chip" style="background-color: #FFCDD2;" data-color="#FFCDD2" title="Rosa Pastel"></div>
            <div class="nbi-color-chip" style="background-color: #E1BEE7;" data-color="#E1BEE7" title="Violeta Pastel"></div>
            <div class="nbi-color-chip" style="background-color: #FFFFFF;" data-color="#FFFFFF" title="Blanco Nítido"></div>
            <div class="nbi-color-chip" style="background-color: #000000;" data-color="#000000" title="Negro Contraste"></div>
          </div>
        </div>

        <!-- CONTROL DE GROSOR ELÁSTICO -->
        <div class="nbi-stroke-control">
          <div class="nbi-stroke-header">
            <span>Grosor del Lápiz:</span>
            <span id="stroke-value-display">8px</span>
          </div>
          <div class="nbi-slider-wrapper">
            <input class="nbi-slider" id="stroke-slider" type="range" min="4" max="24" value="8" />
          </div>
        </div>

        <!-- ACCIONES DEL SISTEMA (DESCARGA) -->
        <div style="display: flex; gap: 8px; margin-top: auto; border-top: 3px solid var(--nbi-black); padding-top: 16px;">
          <button class="nbi-btn nbi-btn-success" id="action-export" style="flex: 1;" title="Descargar mapa con tus dibujos">
            <i data-lucide="download"></i>
            <span style="font-weight: bold; margin-left: 6px;">Guardar</span>
          </button>
        </div>
      </div>

      <!-- PANTALLA JUGUETONA DE CARGA -->
      <div id="loader-overlay" class="nbi-loader-overlay hidden">
        <div class="nbi-loader"></div>
        <div class="nbi-loader-text">¡Preparando tu mapa...!</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
